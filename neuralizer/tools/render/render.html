<!doctype html><html><head><meta charset="utf-8">
<style>
 body{margin:0;font-family:Helvetica,Arial,sans-serif;}
 #wrap{display:flex}
 .v{position:relative}
 .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 0 14px;background:rgba(211,214,218,0.93);text-align:center;font-weight:700;color:#1d1f22;font-size:21px;letter-spacing:1px}
 .sub{font-weight:400;font-size:14px;color:#3d4248;margin-top:4px;padding:0 10px}
 .num{position:absolute;left:16px;top:12px;font-weight:800;font-size:44px;color:#c0392b}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body><div id="wrap"></div>
<script type="module">
import * as THREE from 'three';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {toCreasedNormals} from 'three/addons/utils/BufferGeometryUtils.js';
const P = new URLSearchParams(location.search);
const scene_def = await (await fetch(P.get('scene'))).json();
const W = scene_def.w || 520, H = scene_def.h || 1100;
const loader = new STLLoader(), cache = {};
const geo = f => cache[f] ??= new Promise(res => loader.load(f, g => res(toCreasedNormals(g, 0.5))));
const MAT = {
  silver: () => new THREE.MeshStandardMaterial({color:0xc9ced6, metalness:0.6, roughness:0.26}),
  white:  () => new THREE.MeshStandardMaterial({color:0xf1f1ee, metalness:0.0, roughness:0.55}),
  black:  () => new THREE.MeshStandardMaterial({color:0x111113, metalness:0.15, roughness:0.4}),
  grey:   () => new THREE.MeshStandardMaterial({color:0x8a8f96, metalness:0.5, roughness:0.4}),
  copper: () => new THREE.MeshStandardMaterial({color:0xd27d46, metalness:0.9, roughness:0.3, emissive:0x2a1000}),
  orange: () => new THREE.MeshStandardMaterial({color:0xff8a2a, metalness:0.1, roughness:0.45, emissive:0x501800}),
  led_red:() => new THREE.MeshStandardMaterial({color:0xff2020, emissive:0x600000, transparent:true, opacity:0.9}),
  led_white:()=> new THREE.MeshStandardMaterial({color:0xffffff, emissive:0x303030, transparent:true, opacity:0.9}),
  clear:  () => new THREE.MeshPhysicalMaterial({color:0xdfeaf0, roughness:0.12, transparent:true, opacity:0.5, clearcoat:1}),
  clear_red:()=> new THREE.MeshPhysicalMaterial({color:0xff1a0a, emissive:0xff1a0a, emissiveIntensity:0.8, roughness:0.35, transparent:true, opacity:0.97}),
  clear_white:()=>new THREE.MeshPhysicalMaterial({color:0xfffdf6, emissive:0xfffdf6, emissiveIntensity:2.0, roughness:0.35, transparent:true, opacity:0.98}),
  ghost:  () => new THREE.MeshStandardMaterial({color:0xb8bec6, metalness:0.2, roughness:0.6, transparent:true, opacity:0.22, depthWrite:false}),
  pla_white:()=> new THREE.MeshStandardMaterial({color:0xf4f4f2, roughness:0.6}),
  pla_black:()=> new THREE.MeshStandardMaterial({color:0x1b1b1d, roughness:0.5}),
  pla_clear:()=> new THREE.MeshPhysicalMaterial({color:0xcfe6f0, roughness:0.15, transparent:true, opacity:0.6}),
};
const toThree = ([x,y,z]) => new THREE.Vector3(x, z, -y);
for (const v of scene_def.views) {
  const div = document.createElement('div'); div.className = 'v';
  const r = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
  r.setSize(v.w || W, H); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
  r.localClippingEnabled = true;
  div.appendChild(r.domElement);
  if (v.caption) { const c = document.createElement('div'); c.className='cap'; c.innerHTML = v.caption + (v.sub?`<div class="sub">${v.sub}</div>`:''); div.appendChild(c); }
  if (v.num) { const n = document.createElement('div'); n.className='num'; n.textContent = v.num; div.appendChild(n); }
  document.getElementById('wrap').appendChild(div);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(v.bg || 0xd3d6da);
  const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(300, 260, 400); scene.add(key);
  scene.add(new THREE.AmbientLight(0xffffff, 0.85)); scene.add(new THREE.HemisphereLight(0xffffff, 0x666666, 1.5));
  const fill = new THREE.DirectionalLight(0xffffff, 1.0); fill.position.set(-300, 100, -300); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 1.1); rim.position.set(-100, 300, 400); scene.add(rim);
  const root = new THREE.Group(); root.rotation.x = -Math.PI/2; scene.add(root);
  const clip = v.cut ? [new THREE.Plane(new THREE.Vector3(0,0,-1), 0)] : [];
  if (v.bed) {   // textured PEI plate
    const [bx, by] = v.bed;
    const m = new THREE.Mesh(new THREE.BoxGeometry(256, 256, 1.5), new THREE.MeshStandardMaterial({color:0x2c2d30, roughness:0.85}));
    m.position.set(bx + 128, by + 128, -0.76); root.add(m);
    const g = new THREE.GridHelper(256, 8, 0x45474c, 0x3a3c40); g.rotation.x = Math.PI/2; g.position.set(bx+128, by+128, 0.01); root.add(g);
  }
  for (const d of v.meshes) {
    const g = await geo(d.file);
    const mat = MAT[d.mat](); mat.clippingPlanes = d.nocut ? [] : clip; mat.side = THREE.DoubleSide;
    const m = new THREE.Mesh(g, mat);
    if (d.rotz) m.rotation.z = d.rotz * Math.PI / 180;
    const p = d.pos || [0,0,0]; m.position.set(p[0], p[1], p[2]);
    root.add(m);
  }
  for (const L of (v.lights || [])) { const pl = new THREE.PointLight(L.color, L.i, L.d || 70, 2); pl.position.copy(toThree(L.pos)); scene.add(pl); }
  const c = v.camera, t = toThree(c.target);
  const yaw = c.yaw*Math.PI/180, pitch = c.pitch*Math.PI/180, d = c.dist;
  const cp = [c.target[0] + d*Math.cos(pitch)*Math.cos(yaw), c.target[1] + d*Math.cos(pitch)*Math.sin(yaw), c.target[2] + d*Math.sin(pitch)];
  const cam = new THREE.PerspectiveCamera(c.fov || 20, (v.w || W)/H, 1, 8000);
  cam.position.copy(toThree(cp)); cam.lookAt(t);
  r.render(scene, cam);
}
window.READY = true;
</script></body></html>
