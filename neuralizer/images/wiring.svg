<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="860" viewBox="0 0 1560 860" font-family="Helvetica, Arial, sans-serif">
  <rect width="1560" height="860" fill="#f6f6f4"/>
  <text x="40" y="50" font-size="28" font-weight="700" fill="#111">Neuralizer wiring (default: 3 × LR44 = 4.5 V)</text>
  <text x="40" y="80" font-size="17" fill="#444">Sleeve switch S1 (copper tape) → node N → red LED always, white LED only while HOURS (S2) is pressed.</text>

  <!-- ===================== SCHEMATIC ===================== -->
  <g stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- B+ -->
    <path d="M150 420 V170 H300" stroke="#d62728"/>
    <!-- S1 -->
    <path d="M380 170 H470" stroke="#ff7f0e"/>
    <!-- N bus -->
    <path d="M470 170 H800" stroke="#ff7f0e"/>
    <path d="M560 170 V330 H620" stroke="#ff7f0e"/>
    <!-- red branch -->
    <path d="M800 170 H860" stroke="#ff7f0e"/>
    <path d="M940 170 H1010" stroke="#555"/>
    <path d="M1070 170 H1150 V560" stroke="#222"/>
    <!-- white branch -->
    <path d="M700 330 H800" stroke="#e8c000"/>
    <path d="M800 330 H860" stroke="#e8c000"/>
    <path d="M940 330 H1010" stroke="#555"/>
    <path d="M1070 330 H1150" stroke="#222"/>
    <!-- B- return -->
    <path d="M1150 560 H150 V500" stroke="#222"/>
  </g>
  <!-- battery -->
  <g>
    <rect x="110" y="420" width="80" height="80" rx="6" fill="#ccc" stroke="#333" stroke-width="2"/>
    <line x1="125" y1="440" x2="175" y2="440" stroke="#111" stroke-width="5"/>
    <line x1="135" y1="455" x2="165" y2="455" stroke="#111" stroke-width="3"/>
    <line x1="125" y1="470" x2="175" y2="470" stroke="#111" stroke-width="5"/>
    <line x1="135" y1="485" x2="165" y2="485" stroke="#111" stroke-width="3"/>
    <text x="200" y="450" font-size="16" fill="#111">BATTERY</text>
    <text x="200" y="470" font-size="14" fill="#444">3 × LR44 / SR44</text>
    <text x="200" y="488" font-size="14" fill="#444">+ faces DOWN (cap)</text>
    <text x="158" y="415" font-size="18" fill="#d62728" font-weight="700">+</text>
    <text x="160" y="520" font-size="18" fill="#111" font-weight="700">−</text>
  </g>
  <!-- S1 -->
  <g>
    <rect x="300" y="150" width="80" height="40" rx="6" fill="#f2d3b3" stroke="#a0522d" stroke-width="2"/>
    <text x="340" y="176" font-size="15" text-anchor="middle" fill="#5a2d0c" font-weight="700">S1</text>
    <text x="340" y="135" font-size="14" text-anchor="middle" fill="#333">sleeve switch</text>
    <text x="340" y="215" font-size="12" text-anchor="middle" fill="#555">pads P1 / P2 on the land,</text>
    <text x="340" y="230" font-size="12" text-anchor="middle" fill="#555">bridged by tape on the bump</text>
    <text x="340" y="245" font-size="12" text-anchor="middle" fill="#555">(or fallback 6×6 switch)</text>
  </g>
  <circle cx="560" cy="170" r="7" fill="#ff7f0e"/>
  <text x="572" y="160" font-size="18" fill="#c45f00" font-weight="700">N</text>
  <!-- S2 -->
  <g>
    <rect x="620" y="310" width="80" height="40" rx="6" fill="#222"/>
    <text x="660" y="336" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">S2</text>
    <text x="660" y="375" font-size="14" text-anchor="middle" fill="#333">HOURS button</text>
    <text x="660" y="392" font-size="12" text-anchor="middle" fill="#555">6×6 tactile (any 2 legs</text>
    <text x="660" y="407" font-size="12" text-anchor="middle" fill="#555">on opposite sides)</text>
  </g>
  <text x="745" y="320" font-size="18" fill="#a88a00" font-weight="700">X</text>
  <!-- resistors -->
  <g font-size="15" text-anchor="middle">
    <rect x="860" y="157" width="80" height="26" fill="#e9d9b5" stroke="#7a5a1a" stroke-width="2"/>
    <text x="900" y="145" fill="#333" font-weight="700">270 Ω</text>
    <text x="900" y="205" fill="#666" font-size="12">red-violet-brown</text>
    <rect x="860" y="317" width="80" height="26" fill="#e9d9b5" stroke="#7a5a1a" stroke-width="2"/>
    <text x="900" y="305" fill="#333" font-weight="700">82 Ω</text>
    <text x="900" y="365" fill="#666" font-size="12">grey-red-black</text>
  </g>
  <!-- LEDs -->
  <g>
    <polygon points="1010,150 1010,190 1050,170" fill="#e02020" stroke="#600" stroke-width="2"/>
    <line x1="1052" y1="150" x2="1052" y2="190" stroke="#600" stroke-width="4"/>
    <text x="1030" y="135" font-size="15" text-anchor="middle" font-weight="700" fill="#b00">RED LED</text>
    <text x="1030" y="215" font-size="12" text-anchor="middle" fill="#555">under the red band</text>
    <polygon points="1010,310 1010,350 1050,330" fill="#fff" stroke="#555" stroke-width="2"/>
    <line x1="1052" y1="310" x2="1052" y2="350" stroke="#555" stroke-width="4"/>
    <text x="1030" y="295" font-size="15" text-anchor="middle" font-weight="700" fill="#333">WHITE LED</text>
    <text x="1030" y="375" font-size="12" text-anchor="middle" fill="#555">inside the dome</text>
    <text x="1030" y="410" font-size="12" text-anchor="middle" fill="#555">LED symbol: long leg (+) left,</text><text x="1030" y="425" font-size="12" text-anchor="middle" fill="#555">short leg / flat side (−) right</text>
  </g>
  <text x="1160" y="460" font-size="18" fill="#111" font-weight="700">B−</text>
  <text x="225" y="160" font-size="18" fill="#d62728" font-weight="700">B+</text>
  <!-- legend -->
  <g font-size="15">
    <text x="40" y="620" font-weight="700" fill="#111">Wires (suggested colours, 26–30 AWG stranded is easiest; 22 AWG fits)</text>
    <rect x="40" y="636" width="30" height="8" fill="#d62728"/><text x="80" y="645">B+  : battery cone pad → up the bay groove → pad P1            ≈ 90 mm</text>
    <rect x="40" y="661" width="30" height="8" fill="#ff7f0e"/><text x="80" y="670">N   : pad P2 → HOURS switch leg → 270 Ω in the LED head          ≈ 60 + 40 mm</text>
    <rect x="40" y="686" width="30" height="8" fill="#e8c000"/><text x="80" y="695">X   : other HOURS switch leg → 82 Ω in the LED head                ≈ 50 mm</text>
    <rect x="40" y="711" width="30" height="8" fill="#222"/><text x="80" y="720">B−  : spring disc (top of the cells) → both LED short legs           ≈ 150 mm</text>
    <text x="40" y="755" fill="#444">Only the push-button pair (N and X) plus the battery return (B−) leave the LED head: the circuit needs the node N</text>
    <text x="40" y="775" fill="#444">at the top for the red LED, so three conductors are the minimum. Resistors sit in the bores under each LED.</text>
    <text x="40" y="805" fill="#444">Current: red ≈ 9 mA (ready), white ≈ 17 mA (flash). Other batteries: see the table in BUILD_GUIDE.md.</text>
  </g>

  <!-- ===================== PHYSICAL ROUTE ===================== -->
  <g transform="translate(1290,105)">
    <text x="0" y="0" font-size="16" font-weight="700" text-anchor="middle">route in the body</text>
    <rect x="-22" y="20" width="44" height="640" rx="6" fill="#e2e4e8" stroke="#777"/>
    <!-- head -->
    <rect x="-18" y="24" width="36" height="34" fill="#222"/><text x="30" y="46" font-size="12">LED head (z 145–163)</text>
    <!-- window -->
    <rect x="4" y="70" width="16" height="200" fill="#c9ccd1" stroke="#777"/><text x="30" y="90" font-size="12">window (front)</text>
    <rect x="6" y="120" width="12" height="14" fill="#111"/><text x="30" y="132" font-size="12">S2 HOURS (z 127)</text>
    <!-- land -->
    <rect x="-22" y="282" width="10" height="22" fill="#b87333"/><text x="30" y="298" font-size="12">P1/P2 land (back, z 69–77)</text>
    <!-- battery -->
    <rect x="-12" y="560" width="24" height="60" fill="#999"/><text x="30" y="585" font-size="12">cells (z 9–25)</text>
    <rect x="-14" y="552" width="28" height="6" fill="#ffa040"/><text x="30" y="556" font-size="12">spring (B−)</text>
    <rect x="-18" y="624" width="36" height="30" fill="#bbb"/><text x="30" y="644" font-size="12">bottom cap (B+ face)</text>
    <!-- wires in the -Y channel -->
    <path d="M-8 58 V550" stroke="#222" stroke-width="3" fill="none"/>
    <path d="M-4 58 V127 H6" stroke="#e8c000" stroke-width="3" fill="none"/>
    <path d="M0 58 V127 M0 127 V293 H-12" stroke="#ff7f0e" stroke-width="3" fill="none"/>
    <path d="M-17 293 H-14 V620" stroke="#d62728" stroke-width="3" fill="none"/>
  </g>
</svg>
